const SLIDES=[{"en": ["Model Validation & Hyperparameter Optimization", "Four lessons. One evidence-aware workflow.", "Cross-validation · Nested CV · Grid Search · Random Search & AutoML"], "pt": ["Validação de Modelos & Otimização de Hiperparâmetros", "Quatro aulas. Um fluxo orientado por evidências.", "Validação cruzada · Nested CV · Grid Search · Random Search & AutoML"]}, {"en": ["Learning path", "Class 06: choose the correct evaluation scheme.", "Class 07: audit selection with nested CV.", "Class 08: systematic grid search.", "Class 09: budgeted random search and AutoML boundaries."], "pt": ["Trilha de aprendizagem", "Aula 06: escolha o esquema correto de avaliação.", "Aula 07: audite a seleção com nested CV.", "Aula 08: busca sistemática em grade.", "Aula 09: busca aleatória com orçamento e limites do AutoML."]}, {"en": ["Source and evidence", "Sources: four uploaded READMEs, not newly inspected notebooks or PDFs.", "Classroom results are source-reported and were not rerun.", "Class 08 is a curated extract because two source files shared a filename.", "The new Python example uses synthetic data, not classroom data."], "pt": ["Fontes e evidências", "Fontes: quatro READMEs enviados; não novos notebooks ou PDFs analisados.", "Os resultados são relatados nas fontes e não foram reexecutados.", "A Aula 08 é um extrato consolidado por conflito de nomes dos arquivos.", "O novo exemplo Python usa dados sintéticos, não os dados da aula."]}, {"en": ["Cross-validation", "Each round fits a fresh model on training folds and scores the held-out fold.", "Report mean and fold-score dispersion, along with the splitter.", "Fold standard deviation is not automatically a confidence interval."], "pt": ["Validação cruzada", "Cada rodada ajusta um novo modelo nos folds de treino e avalia o fold reservado.", "Reporte média e dispersão entre folds, com o splitter.", "Desvio-padrão entre folds não é automaticamente um intervalo de confiança."]}, {"en": ["Choose the splitter", "Independent rows → KFold", "Classification proportions → StratifiedKFold", "Repeated entities → GroupKFold", "Past-to-future prediction → TimeSeriesSplit", "Stratification cannot create rare-class examples."], "pt": ["Escolha o splitter", "Linhas independentes → KFold", "Proporções das classes → StratifiedKFold", "Entidades repetidas → GroupKFold", "Prever futuro com o passado → TimeSeriesSplit", "Estratificação não cria exemplos da classe rara."]}, {"en": ["Nested cross-validation", "Inner loop chooses hyperparameters using outer training data only.", "Outer loop measures the complete selection-and-training procedure.", "After auditing, a final search fits the deliverable model on development data."], "pt": ["Nested cross-validation", "O loop interno escolhe hiperparâmetros apenas nos dados de treino externos.", "O loop externo mede o processo completo de seleção e treino.", "Após a auditoria, a busca final ajusta o modelo nos dados de desenvolvimento."]}, {"en": ["Grid Search: music-hit classification", "Source-reported pipeline: StandardScaler → LogisticRegression.", "C: [0.01, 0.1, 1, 10, 100]; class_weight: [None, balanced].", "10 candidates × 5 folds = 50 CV fits, excluding final refit.", "Average Precision is the optimization metric; the final test stays protected."], "pt": ["Grid Search: classificação de músicas hit", "Pipeline relatado: StandardScaler → LogisticRegression.", "C: [0.01, 0.1, 1, 10, 100]; class_weight: [None, balanced].", "10 candidatos × 5 folds = 50 ajustes de CV, sem o refit final.", "Average Precision é a métrica da busca; teste final permanece protegido."]}, {"en": ["Random Search and distributions", "randint: integer parameters.", "uniform: linear interval; scale means interval width.", "loguniform: positive values across orders of magnitude.", "Lists: categorical alternatives.", "n_iter sets candidate budget, not total model-fit count."], "pt": ["Random Search e distribuições", "randint: parâmetros inteiros.", "uniform: intervalo linear; scale é a largura.", "loguniform: valores positivos em ordens de grandeza.", "Listas: alternativas categóricas.", "n_iter limita candidatos, não o número total de ajustes."]}, {"en": ["Coverage probability", "P(at least one promising trial) = 1 − (1 − p)ⁿ", "Assumes independent draws and a promising-region probability p.", "Coverage is not accuracy and does not guarantee the optimum."], "pt": ["Probabilidade de cobertura", "P(ao menos um teste promissor) = 1 − (1 − p)ⁿ", "Supõe sorteios independentes e probabilidade p da região promissora.", "Cobertura não é acurácia nem garantia do ótimo."]}, {"en": ["Reported results are not a shared benchmark", "Class 06: accuracy 0.8938 ± 0.0117, five-fold.", "Class 07: nested accuracy 0.8467 ± 0.0600.", "Class 08: holdout AP 0.7116 and ROC AUC 0.9296.", "Class 09: original reproducible results not provided.", "Different tasks and metrics: do not rank modules by these numbers."], "pt": ["Resultados relatados não são um benchmark comum", "Aula 06: acurácia 0.8938 ± 0.0117, cinco folds.", "Aula 07: acurácia nested 0.8467 ± 0.0600.", "Aula 08: AP no teste 0.7116 e ROC AUC 0.9296.", "Aula 09: resultados originais reprodutíveis não fornecidos.", "Tarefas e métricas distintas: não ranqueie as aulas por esses números."]}, {"en": ["New copy/paste reference workflow", "Synthetic binary dataset → protected split → baseline → nested search → final fit → holdout.", "Use --method grid or --method random as separate demonstrations.", "Do not choose methods by repeatedly inspecting the protected test.", "Python syntax checked; training not executed when building this package."], "pt": ["Novo fluxo de referência para copiar", "Dataset binário sintético → split protegido → baseline → busca nested → ajuste final → holdout.", "Use --method grid ou --method random como demonstrações separadas.", "Não escolha métodos olhando repetidamente o teste protegido.", "Sintaxe Python verificada; treino não executado na criação do pacote."]}, {"en": ["AutoML: automation without absolution", "Automation can speed preprocessing alternatives, tuning and candidate selection.", "It does not validate label meaning, fairness, privacy or splitting assumptions.", "Experiment tracking, monitoring and deployment are future recommendations here."], "pt": ["AutoML: automação sem isenção de responsabilidade", "Automação acelera alternativas de pré-processamento, tuning e seleção.", "Não valida significado do alvo, justiça, privacidade ou premissas do split.", "Tracking, monitoramento e deploy são recomendações futuras aqui."]}, {"en": ["Presentation hub", "Open the four original presentation links below.", "Their availability was not independently verified during preparation.", "Training learns. Validation chooses. Independent evaluation audits."], "pt": ["Central de apresentações", "Abra os quatro links das apresentações originais abaixo.", "A disponibilidade não foi verificada na preparação.", "Treino aprende. Validação escolhe. Avaliação independente audita."]}];
const LINKS=[["Cross Validation · Interactive", "https://astounding-marzipan-63764d.netlify.app/"], ["Nested Cross Validation", "https://astonishing-dodol-818e9f.netlify.app/"], ["Hyperparameter Search · Grid Search", "https://lively-halva-00f14e.netlify.app/"], ["Random Search and AutoML", "https://taupe-tarsier-591729.netlify.app/"]];
const CODE="\"\"\"New reference example; synthetic data, not a reproduced classroom experiment.\"\"\"\nimport argparse\nimport json\nfrom pathlib import Path\nimport numpy as np\nfrom scipy.stats import loguniform\nfrom sklearn.datasets import make_classification\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import average_precision_score, roc_auc_score\nfrom sklearn.model_selection import (GridSearchCV, RandomizedSearchCV,\n    StratifiedKFold, cross_val_score, train_test_split)\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\n\n\ndef run(method=\"grid\"):\n    X, y = make_classification(n_samples=600, n_features=12,\n        n_informative=6, n_redundant=2, weights=[0.85, 0.15], random_state=42)\n    X_dev, X_test, y_dev, y_test = train_test_split(\n        X, y, test_size=0.2, stratify=y, random_state=42)\n    pipe = Pipeline([(\"scale\", StandardScaler()),\n        (\"model\", LogisticRegression(max_iter=2000, random_state=42))])\n    inner = StratifiedKFold(n_splits=4, shuffle=True, random_state=43)\n    outer = StratifiedKFold(n_splits=5, shuffle=True, random_state=44)\n    if method == \"grid\":\n        search = GridSearchCV(pipe, {\"model__C\": [0.01, 0.1, 1, 10, 100],\n            \"model__class_weight\": [None, \"balanced\"]},\n            scoring=\"average_precision\", cv=inner, n_jobs=1)\n    else:\n        search = RandomizedSearchCV(pipe,\n            {\"model__C\": loguniform(1e-2, 1e2),\n             \"model__class_weight\": [None, \"balanced\"]}, n_iter=20,\n            scoring=\"average_precision\", cv=inner, n_jobs=1, random_state=42)\n    baseline = cross_val_score(pipe, X_dev, y_dev,\n        cv=outer, scoring=\"average_precision\", n_jobs=1)\n    nested = cross_val_score(search, X_dev, y_dev,\n        cv=outer, scoring=\"average_precision\", n_jobs=1)\n    search.fit(X_dev, y_dev)\n    scores = search.best_estimator_.predict_proba(X_test)[:, 1]\n    report = {\n        \"status\": \"new reference experiment on synthetic data\",\n        \"method\": method,\n        \"baseline_cv_ap_mean\": float(np.mean(baseline)),\n        \"baseline_cv_ap_std_ddof0\": float(np.std(baseline)),\n        \"nested_cv_ap_mean\": float(np.mean(nested)),\n        \"nested_cv_ap_std_ddof0\": float(np.std(nested)),\n        \"nested_outer_scores\": nested.tolist(),\n        \"best_internal_cv_ap\": float(search.best_score_),\n        \"best_params\": search.best_params_,\n        \"holdout_ap\": float(average_precision_score(y_test, scores)),\n        \"holdout_roc_auc\": float(roc_auc_score(y_test, scores)),\n    }\n    output = Path(\"artifacts\")\n    output.mkdir(exist_ok=True)\n    (output / f\"{method}-reference.json\").write_text(\n        json.dumps(report, indent=2), encoding=\"utf-8\")\n    print(json.dumps(report, indent=2))\n    return report\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--method\", choices=[\"grid\", \"random\"], default=\"grid\")\n    run(parser.parse_args().method)\n";
let lang='en',index=0,start=null,reactMode=false;const root=document.getElementById('root');function escapeText(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function view(){const s=SLIDES[index][lang];let h='<article class="slide"><div class="kicker">CLASSES 06–09 · '+(lang==='en'?'SOURCE-AWARE CONSOLIDATION':'CONSOLIDAÇÃO COM PROVENIÊNCIA')+'</div><h1>'+escapeText(s[0])+'</h1><ul>'+s.slice(1).map(t=>'<li>'+escapeText(t)+'</li>').join('')+'</ul>';if(index===8)h+='<div class="tools"><label>p (%) <input id="p" type="range" min="1" max="30" value="5"></label><label>n <input id="n" type="range" min="1" max="200" value="50"></label></div><p id="chance"></p>';if(index===10)h+='<button id="copy">'+(lang==='en'?'Copy Python code':'Copiar código Python')+'</button><pre><code>'+escapeText(CODE)+'</code></pre>';h+='<div class="hub">'+LINKS.map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener noreferrer">'+escapeText(l[0])+' ↗</a>').join('')+'</div></article>';return h}function Slide(){return React.createElement('div',{dangerouslySetInnerHTML:{__html:view()}})}let reactRoot=null;function render(){document.getElementById('previousLabel').textContent=lang==='en'?'Previous':'Retornar';document.getElementById('startLabel').textContent=lang==='en'?'Back to start':'Voltar ao início';document.getElementById('nextLabel').textContent=lang==='en'?'Next':'Avançar';document.documentElement.lang=lang;const h=view();if(reactMode){reactRoot.render(React.createElement(Slide));}else root.innerHTML=h;document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+SLIDES.length;document.getElementById('dots').innerHTML=SLIDES.map((s,i)=>'<button data-slide="'+i+'" aria-label="Slide '+(i+1)+'" class="'+(i===index?'active':'')+'"></button>').join('')}function move(d){index=(index+d+SLIDES.length)%SLIDES.length;render()}document.getElementById('slidePrevious').onclick=()=>move(-1);document.getElementById('slideNext').onclick=()=>move(1);document.getElementById('slideStart').onclick=()=>{index=0;render()};document.getElementById('dots').onclick=e=>{const b=e.target.closest('[data-slide]');if(b){index=Number(b.dataset.slide);render()}};document.getElementById('language').onclick=()=>{lang=lang==='en'?'pt':'en';render()};document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');document.getElementById('home').onclick=()=>{index=0;render()};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('runtime').textContent=lang==='en'?'Fullscreen unavailable in this preview. Open the downloaded HTML in your browser.':'Tela cheia indisponível neste preview. Abra o HTML baixado no navegador.'}};window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON','A'].includes(document.activeElement.tagName))return;if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home'){index=0;render()}});root.addEventListener('touchstart',e=>{if(e.target.closest('pre,input,button,a'))return;start=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});root.addEventListener('touchend',e=>{if(!start)return;const x=e.changedTouches[0].clientX-start[0],y=e.changedTouches[0].clientY-start[1];if(Math.abs(x)>55&&Math.abs(x)>Math.abs(y))move(x<0?1:-1);start=null},{passive:true});root.addEventListener('click',async e=>{if(e.target.id!=='copy')return;let ok=false;try{await navigator.clipboard.writeText(CODE);ok=true}catch{const a=document.createElement('textarea');a.value=CODE;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}e.target.textContent=ok?(lang==='en'?'Copied':'Copiado'):(lang==='en'?'Select and copy the code manually':'Selecione e copie o código manualmente')});root.addEventListener('input',()=>{const p=document.getElementById('p'),n=document.getElementById('n'),v=document.getElementById('chance');if(p&&n&&v)v.textContent='p = '+p.value+'% · n = '+n.value+' · P = '+((1-Math.pow(1-p.value/100,n.value))*100).toFixed(2)+'%'});render();function load(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function enhance(){try{await load('https://unpkg.com/react@18.3.1/umd/react.production.min.js');await load('https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js');reactRoot=ReactDOM.createRoot(root);reactMode=true;document.getElementById('runtime').textContent='React mode · Keyboard arrows / Space · Swipe · Click progress markers';render()}catch{document.getElementById('runtime').textContent='Offline mode (native JavaScript fallback) · Keyboard arrows / Space · Swipe · Click progress markers'}}enhance();
